# Configuration of the automated test suite (tests/). Run it with ./run.sh --test.
[pytest]
testpaths = tests
# Lets the tests import backend/ and api/ whichever way pytest is launched.
pythonpath = .
# -ra: summary of skipped/failed tests at the end. --strict-markers: a typo in a
# marker name is an error instead of a silently ignored test selection.
addopts = -ra --strict-markers
