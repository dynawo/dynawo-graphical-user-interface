# Builds the app on every push and on every pull request towards master.
#
# The two job names below ("Frontend build", "Backend build") are what branch
# protection refers to as required status checks — renaming a job means
# updating the rule in Settings > Branches as well, or merges stay blocked
# waiting for a check that never reports.

name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push on the same branch cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Same major as docker/Dockerfile.frontend (node:20-slim).
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm install, NOT npm ci: npm ci skips optional native dependencies,
      # which breaks the rolldown/Vite build (see install.sh).
      - run: npm install

      # tsc -b && vite build — fails on any TypeScript error.
      - run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same version as the Ubuntu 22.04 base of docker/Dockerfile.backend.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      # Python has no compile step; byte-compiling catches syntax errors and
      # importing the FastAPI app catches missing dependencies or broken imports.
      - run: python -m compileall -q api backend util
      - run: python -c "import api.main"
