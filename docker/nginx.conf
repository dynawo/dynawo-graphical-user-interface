#
# nginx serves the built React app AND forwards /api/* to the FastAPI backend,
# so the browser only ever talks to one origin. That is why the CORS list in
# api/main.py and the Vite dev proxy in frontend/vite.config.ts are irrelevant
# in this deployment — there is no cross-origin request to allow.
#
# See docs/running_on_windows.md.

server {
    listen 80;
    server_name _;

    # Uploaded networks and job sets are far larger than nginx's 1 MB default,
    # which would reject them with 413 before the backend ever saw them.
    client_max_body_size 512M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve the built single-page app
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the FastAPI backend container.
    # No URI part on proxy_pass, so the full original path (/api/...) is passed
    # through unchanged — the backend mounts its routers under /api itself.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Simulation logs stream line by line while a run is in progress.
        # Buffering would hold them until the run finished; clearing Connection
        # stops nginx from sending "Connection: close" upstream and cutting the
        # stream short.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";

        # A Dynawo simulation can run far longer than the 60s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
